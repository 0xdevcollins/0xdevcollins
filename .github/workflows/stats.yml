name: Refresh stats

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:           # run by hand from the Actions tab
  push:
    paths:
      - "scripts/stats.mjs"
      - "profile.config.mjs"
      - "scripts/lib/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Build assets/stats-*.svg
        env:
          GH_USER: 0xdevcollins
          # Optional: a classic PAT with read:user saved as STATS_TOKEN also counts private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: node scripts/stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --cached --quiet || (git commit -m "chore: refresh stats [skip ci]" && git push)
